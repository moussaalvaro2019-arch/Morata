# Netlify : le site est dans le dossier « public », l'assistant IA dans netlify/edge-functions,
# les cours protégés dans netlify/functions (contenu dans le dossier « contenus »)
[build]
  publish = "public"
  # empreintes de version + cache navigateur longue durée (moins de requêtes facturées)
  command = "node outils/build.mjs"

# Cours protégés : la fonction netlify/functions/cours.mjs lit le dossier « contenus »
# (non publié) et n'envoie le contenu complet qu'aux apprenants dont l'accès est actif.
[functions]
  included_files = ["contenus/cours/*.js"]

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

# Sécurité : le navigateur n'exécute que les scripts du site (et le secours supabase-js du CDN jsdelivr),
# ne parle qu'au site et à Supabase, et refuse d'afficher le site dans le cadre d'un autre site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; media-src 'self' data: blob:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
